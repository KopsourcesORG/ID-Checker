name: Android arm64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and test host utilities
        run: make clean all test

      - name: Accept SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses <<'EOF'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          EOF

      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Cross-compile arm64 Android binaries
        run: make android-binaries

      - name: Build Android app
        run: gradle --no-daemon -p android assembleDebug

      - name: Verify Android APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='org.kopsources.idkeygenerator'"
          unzip -l "$APK" | grep -q 'assets/id-key-flasher'
          unzip -l "$APK" | grep -q 'assets/META-INF/com/google/android/update-binary'
          unzip -l "$APK" | grep -q 'assets/META-INF/com/google/android/updater-script'

      - name: Verify Android ELF architecture
        run: |
          readelf -h build/android/arm64-v8a/id-checker | grep -q 'Machine:.*AArch64'
          readelf -h build/android/arm64-v8a/id-key-generator | grep -q 'Machine:.*AArch64'
          readelf -h build/android/arm64-v8a/id-key-flasher | grep -q 'Machine:.*AArch64'
          if readelf -l build/android/arm64-v8a/id-key-flasher | grep -q 'Requesting program interpreter'; then
            echo 'id-key-flasher must be static for recovery compatibility' >&2
            exit 1
          fi
          tls_segment=$(readelf -lW build/android/arm64-v8a/id-key-flasher | awk '$1 == "TLS" { print $3, $NF; found=1 } END { if (!found) exit 1 }') || {
            readelf -lW build/android/arm64-v8a/id-key-flasher
            echo 'id-key-flasher has no PT_TLS segment' >&2
            exit 1
          }
          read -r tls_vaddr tls_align <<< "$tls_segment"
          echo "id-key-flasher PT_TLS: vaddr=$tls_vaddr align=$tls_align"
          if (( tls_align < 64 )); then
            echo 'id-key-flasher PT_TLS alignment must be at least 64 bytes' >&2
            exit 1
          fi
          if (( tls_vaddr % tls_align != 0 )); then
            echo 'id-key-flasher PT_TLS virtual address is not aligned' >&2
            exit 1
          fi

      - name: Smoke-test key generation
        run: |
          mkdir -p build/smoke
          cd build/smoke
          ../id-key-generator -id 1772609505
          test -s id.ike
          test -s id.ike2
          test "$(wc -c < id.ike)" -eq 96
          test "$(wc -c < id.ike2)" -eq 128

      - name: Upload Android arm64 binaries and APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: id-checker-android-arm64
          path: |
            build/android/arm64-v8a/
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
