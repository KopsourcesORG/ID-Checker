plugins {
    id 'com.android.application'
}

def idkeyGeneratedAssets = file("$buildDir/generated/idkey-assets")

android {
    namespace 'org.kopsources.idkeygenerator'
    compileSdk 36

    defaultConfig {
        applicationId 'org.kopsources.idkeygenerator'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main {
            assets.srcDir('../../flashable')
            assets.srcDir(idkeyGeneratedAssets)
        }
    }
}

tasks.register('prepareIdKeyFlasher', Copy) {
    def flasher = rootProject.projectDir.parentFile.toPath()
        .resolve('build/android/arm64-v8a/id-key-flasher').toFile()
    from(flasher)
    into(idkeyGeneratedAssets)
    rename { 'id-key-flasher' }
    doFirst {
        if (!flasher.isFile()) {
            throw new GradleException('Missing build/android/arm64-v8a/id-key-flasher; run make android-binaries first.')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareIdKeyFlasher')
}
